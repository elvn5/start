version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: app/backend/gen/proto
plugins:
  # Плагины запускаются через `go tool` из модуля backend/tools — глобальная установка не нужна.
  - local: [go, tool, -modfile=../tools/go.mod, protoc-gen-go]
    out: ../gen/proto
    opt: paths=source_relative
  - local: [go, tool, -modfile=../tools/go.mod, protoc-gen-connect-go]
    out: ../gen/proto
    opt: paths=source_relative
