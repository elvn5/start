name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # нужна ветка main для buf breaking
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('backend/go.sum', 'backend/tools/go.sum') }}
      - run: git branch -f main origin/main || true
      - run: task setup
      - run: task check
      - name: Generated code is up to date
        run: git diff --exit-code

  images:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: identity, file: backend/Dockerfile, args: SERVICE=identity }
          - { name: gateway,  file: backend/Dockerfile, args: SERVICE=gateway }
          - { name: web,      file: apps/web/Dockerfile, args: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: prod
          build-args: ${{ matrix.args }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
