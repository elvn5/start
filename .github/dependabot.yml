# Обновления сгруппированы, чтобы не получать десятки PR в неделю.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/backend, /backend/tools]
    schedule: { interval: weekly }
    groups:
      go: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: docker
    directories: [/backend, /apps/web]
    schedule: { interval: monthly }
